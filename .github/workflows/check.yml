name: Проверка репозитория
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node agent/verify-analysis.mjs
      - run: node agent/verify-full-read.mjs
      - run: node agent/verify-workflow.mjs
      - run: node agent/verify-monitor.mjs
      - run: node agent/verify-config.mjs
      - run: node agent/verify-demo-access.mjs
      - run: node agent/verify-voice-text.mjs
      # Actual model and voice acceptance needs an API key and downloaded speech weights.
      # These are intentionally not placed in public CI or committed fixtures.
